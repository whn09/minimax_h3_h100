# CONTROL: the upstream 768p / 14.4 s headline workload, re-measured on H100 so the 480p
# number has an anchor in the published table. Upstream reports 2.29 s/NFE on 8x H200 and
# 1.40 s/NFE on 8x B200 for exactly this shape. The denoise here is comparable to their
# 8nfe_tuned_fp8_ulysses_h200.yaml -- same numerics, same NFE, same canvas, and their
# published figure is denoise-only -- so any gap in s/NFE is the H100-vs-H200 gap, measured
# rather than assumed, and it is the factor to apply when comparing the 480p result to a
# published H200 number. The parallel.* decode fields below have no counterpart upstream;
# they are what makes 80 GiB enough to hold the weights across the decode.
#
#   torchrun --standalone --nproc_per_node=8 src/inference/infer_ulysses.py \
#       --config configs/inference/8nfe_768p_345f_ulysses_h100.yaml \
#       checkpoint=ckpts/stage-dmd-step-250 \
#       render.prompt_file=prompts/example_2.pt render.out=results/768p_144s.mp4

kernels:
  inference_kernels: true
  softmax_backend: flex

precision:
  fp8:
    enabled: true
    skip_end_blocks: 0

parallel:
  # 5 softmax + 3 linear: 2.470 s/NFE, the best of the swept 0/3/4/5/6 at this canvas
  # (RESULTS.md). Upstream's 6+2 is 2.590 here, only 5 % off -- a much better default at
  # 768p than it is at 480p, where it costs 24 %. Note that 480p's winner, 3, is the WORST
  # of the five here (3.331): the window softmax costs
  # O(rows x window_frames x tokens_per_frame) and 768p has 1008 tokens per frame against
  # 480p's 405, so there is 2.49x more softmax work per row to spread and it wants more
  # ranks to spread it over. The split is a property of the canvas, not of the machine.
  softmax_ranks: 5
  profile: false
  # The DiT STAYS on the card at 768p, which took two patches to earn. 45.2 GiB of weights
  # on every rank, ~11 GiB of decoders on rank 0, and a 345-frame 1344x768 decode used to be
  # 102 MiB past what an 80 GiB card has, so this said "free" and the render paid 2.81 s to
  # evict weights it would have to rebuild (138-232 s) on the next request. The two switches
  # below take rank 0's decode peak down instead -- measured 64.5 GiB reserved, ~1 GiB clear
  # of the non-PyTorch floor -- and the eviction stage disappears; a second request needs
  # nothing rebuilt. "offload" remains strictly dominated and unused; see
  # src/config/inference.py.
  transformer_before_decode: keep
  # ...and the DECODERS are what cycles instead, which is the half of this that a single
  # render cannot show and `render.repeat=10` did: with both set to keep, request 1 renders
  # and request 2's denoise dies 444-468 MiB short on the three linear-branch ranks, because
  # the decoders are loaded after the first denoise and so coexist with every later one.
  # One of the two has to go per request at this canvas; the video VAE is 9.70 GiB per rank
  # against the DiT's 45.24, so cycling it moves 4.7x less data. Measured cost: 5.05 s of
  # decoder load + 1.82 s of release inside a 33.21 s +/- 0.85 request, ten requests, zero
  # memory growth. At 480p neither side has to cycle and both stay keep.
  vae_after_decode: free
  # Both are REQUIRED by transformer_before_decode: keep at this canvas, and stream_yuv_assembly
  # is validated to imply parallel_vae_decode. Together they remove the three full-canvas
  # buffers rank 0 used to hold: the fp16 RGB clip (1.99 GiB), the fp32 denormalisation
  # (3.98 GiB), and the whole-decode all-gather destination (3.045 GiB, now gathered one
  # round of chunks at a time, 0.38 GiB). Output is bit-identical either way --
  # scripts/decode_parity.py checks both claims at this exact geometry.
  parallel_vae_decode: true
  stream_yuv_assembly: true

render:
  height: 768
  width: 1344
  num_frames: 345      # -> 345 frames = 14.375 s, the upstream headline workload
  num_steps: 8
  warmup_steps: 2
  video_shift: 12.0
  audio_shift: 3.0
