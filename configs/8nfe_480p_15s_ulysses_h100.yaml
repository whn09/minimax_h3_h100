# THE DELIVERABLE: 480p, 15 s, 8 NFE, 8x H100 80GB (p5.48xlarge), branch-parallel Ulysses.
#
#   torchrun --standalone --nproc_per_node=8 src/inference/infer_ulysses.py \
#       --config configs/inference/8nfe_480p_15s_ulysses_h100.yaml \
#       checkpoint=ckpts/stage-dmd-step-250 \
#       render.prompt_file=prompts/example_2.pt render.out=results/480p_15s.mp4
#
# Differences from the upstream 8nfe_tuned_fp8_ulysses_h200.yaml:
#   * render.height/width 480x864 instead of the released 768x1344 -- needs
#     patches/0001-vdn-render-resolution-as-a-config-field.patch, which turns
#     render.py's hardcoded LATENT_H, LATENT_W = 48, 84 into a config field.
#   * render.num_frames 360, which align_num_frames(.., 17, 5) rounds to 362 frames
#     = 15.083 s at 24 fps (107 latent frames). 345 -> 14.375 s is upstream's.
#   * parallel.softmax_ranks is the sweep variable, not a constant: the H200 file's 6+2
#     was tuned on a 104k-row 768p sequence, and 480p/15 s is 45k rows -- 2.3x shorter,
#     so the compute/communication balance moves. scripts/h100_grid.sh sweeps it.
#
# H100 is sm90, the same capability H200 is, so every kernel choice in the upstream H200
# file carries over unchanged: `softmax_backend: flex` is the FA4-CuTe static variant and
# fp8 e4m3 uses rowwise scale granularity on sm90. What differs is HBM (80 vs 141 GB) and
# bandwidth (3.35 vs 4.8 TB/s), neither of which changes which kernel is correct.

kernels:
  inference_kernels: true
  softmax_backend: flex

precision:
  fp8:
    enabled: true
    skip_end_blocks: 0

parallel:
  softmax_ranks: 6
  profile: false

render:
  height: 480
  width: 864
  num_frames: 360      # -> 362 frames = 15.083 s
  num_steps: 8
  warmup_steps: 2
  video_shift: 12.0
  audio_shift: 3.0
